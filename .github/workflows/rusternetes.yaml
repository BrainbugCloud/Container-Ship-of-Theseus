name: Rusternetes Conformance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Test mode
        type: choice
        default: quick
        options:
          - quick
          - full

# Bump versions together:
#   K8S_VERSION   → sonobuoy --kubernetes-version
#   SONOBUOY_VER  → sonobuoy CLI + container image

jobs:
  build:
    name: Build rusternetes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOCKER_HOST: unix:///run/podman/podman.sock
    steps:
      - name: Checkout (with rusternetes submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clone rhino adjacent to rusternetes
        run: git clone --depth 1 https://github.com/calfonso/rhino.git rusternetes/../rhino

      - name: Get rusternetes submodule SHA
        id: submodule-sha
        run: echo "sha=$(git -C rusternetes rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          # Rootful podman socket — required for privileged kubelet containers
          sudo mkdir -p /etc/systemd/system/podman.socket.d
          printf '[Socket]\nSocketMode=0666\n' | sudo tee /etc/systemd/system/podman.socket.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl enable --now podman.socket

      - name: Cache container images by submodule SHA
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/rusternetes-images.tar
          key: rusternetes-images-${{ runner.os }}-${{ steps.submodule-sha.outputs.sha }}
          restore-keys: |
            rusternetes-images-${{ runner.os }}-

      - name: Build container images
        if: steps.image-cache.outputs.cache-hit != 'true'
        working-directory: rusternetes
        run: |
          export KUBELET_VOLUMES_PATH=${{ github.workspace }}/rusternetes/.rusternetes/volumes
          mkdir -p "$KUBELET_VOLUMES_PATH"
          sudo -E podman compose -f compose.yml build

      - name: Save container images to tarball
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          # Save all rusternetes-* images plus the etcd base image
          # Must use sudo — images were built with sudo (rootful podman store)
          # podman may store short names as localhost/rusternetes-* or
          # docker.io/library/rusternetes-*, so match anywhere in the repository.
          images=$(sudo podman images --format '{{.Repository}}:{{.Tag}}' | grep -E '(rusternetes-|quay.io/coreos/etcd)' || true)
          if [ -z "$images" ]; then
            echo "No rusternetes images found! Listing all images for debugging:"
            sudo podman images
            exit 1
          fi
          echo "Saving images: $images"
          sudo podman save -o /tmp/rusternetes-images.tar $images
          sudo chmod 644 /tmp/rusternetes-images.tar
          ls -lh /tmp/rusternetes-images.tar

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusternetes-images
          path: /tmp/rusternetes-images.tar
          retention-days: 1

  conformance:
    name: Rusternetes (${{ inputs.mode }}) K8s v1.36.1
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'quick' && 60 || 360 }}
    env:
      K8S_VERSION: v1.36.1
      SONOBUOY_VER: v0.57.5
      KUBELET_VOLUMES_PATH: ${{ github.workspace }}/rusternetes/.rusternetes/volumes
      CONTAINER_RUNTIME: podman
      # podman compose shells out to docker-compose, which needs DOCKER_HOST
      # to find the rootful podman socket (systemctl enable podman.socket).
      DOCKER_HOST: unix:///run/podman/podman.sock

    steps:
      - name: Checkout (with rusternetes submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download container images
        uses: actions/download-artifact@v4
        with:
          name: rusternetes-images
          path: /tmp/

      - name: Load container images
        run: |
          sudo podman load -i /tmp/rusternetes-images.tar
          sudo podman images | grep rusternetes

      - name: Install podman + tools
        env:
          CRICTL_VER: v1.36.0
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          # crictl is not in Ubuntu apt repos — install from cri-tools GitHub release
          curl -sSL "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VER}/crictl-${CRICTL_VER}-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin crictl
          crictl --version
          # podman socket for bollard (Docker API compat)
          # Use a systemd drop-in so the socket is world-accessible — chmod after
          # systemctl start races with socket activation and gets reset.
          sudo mkdir -p /etc/systemd/system/podman.socket.d
          printf '[Socket]\nSocketMode=0666\nDirectoryMode=0777\n' | sudo tee /etc/systemd/system/podman.socket.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl enable --now podman.socket
          # Debug: show socket status and file
          echo "=== systemctl status podman.socket ==="
          sudo systemctl status podman.socket --no-pager || true
          echo "=== /run/podman/ contents ==="
          ls -la /run/podman/ 2>&1 || true
          echo "=== socket file info ==="
          stat /run/podman/podman.sock 2>&1 || true
          # Verify socket works with podman CLI (not curl — curl gives misleading
          # "port 80" errors when the unix socket is missing)
          echo "=== podman info via socket ==="
          podman --url unix:///run/podman/podman.sock info 2>&1 | head -20 || true

      - name: Install kubectl
        run: |
          curl -sSL "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" \
            | sudo tee /usr/local/bin/kubectl > /dev/null
          sudo chmod +x /usr/local/bin/kubectl

      - name: Install Sonobuoy
        run: |
          curl -sSL "https://github.com/vmware-tanzu/sonobuoy/releases/download/${SONOBUOY_VER}/sonobuoy_${SONOBUOY_VER#v}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin sonobuoy
          sonobuoy version --short

      - name: Generate certs
        run: |
          # Note: do NOT pre-create rusternetes-network here. compose.yml already
          # declares it (name: rusternetes-network) as a non-external network, so
          # if it already exists without compose's own labels, `podman compose up`
          # refuses to reuse it: "network ... was not created by compose" /
          # "incorrect label com.docker.compose.network". Let compose create it.
          cd rusternetes && bash scripts/generate-certs.sh

      - name: Start rusternetes cluster
        working-directory: rusternetes
        run: |
          export KUBELET_VOLUMES_PATH=${{ github.workspace }}/rusternetes/.rusternetes/volumes
          mkdir -p "$KUBELET_VOLUMES_PATH"
          # Images pre-built in build job — no --build needed
          sudo -E podman compose -f compose.yml up -d

      - name: Wait for API server
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/healthz || echo 000)
            [ "$code" = "200" ] && break
            echo "Waiting for API server... ($i/60) status=$code"
            sleep 2
          done
          [ "$code" = "200" ] || { echo "API server never became healthy"; exit 1; }

      - name: Bootstrap cluster
        run: |
          cd rusternetes && bash scripts/bootstrap-cluster.sh podman
          kubectl --insecure-skip-tls-verify --server https://127.0.0.1:6443 get nodes
          kubectl --insecure-skip-tls-verify --server https://127.0.0.1:6443 get pods -A

      - name: Run Sonobuoy (${{ inputs.mode }})
        env:
          SONOBUOY_MODE: ${{ inputs.mode == 'quick' && 'quick' || 'certified-conformance' }}
          WAIT_MINUTES: ${{ inputs.mode == 'quick' && '20' || '240' }}
        run: |
          export KUBECONFIG=/dev/null
          K='kubectl --insecure-skip-tls-verify --server https://127.0.0.1:6443 --token dummy'
          $K create ns sonobuoy 2>/dev/null || true; sleep 2
          sonobuoy run \
            --mode="$SONOBUOY_MODE" \
            --kubernetes-version="$K8S_VERSION" \
            --sonobuoy-image=sonobuoy/sonobuoy:${SONOBUOY_VER} \
            --wait="$WAIT_MINUTES" \
            --plugin-env=e2e.E2E_USE_GO_RUNNER=false

      - name: Collect results
        if: always()
        run: |
          export KUBECONFIG=/dev/null
          sonobuoy status || true
          sonobuoy logs > sonobuoy-logs.txt 2>&1 || echo "No logs" > sonobuoy-logs.txt
          sonobuoy retrieve -f results.tar.gz || true
          if [ -f results.tar.gz ]; then
            sonobuoy results results.tar.gz || true
          fi

      - name: Collect cluster logs
        if: always()
        working-directory: rusternetes
        run: |
          # Use `podman logs` per-container rather than `compose logs` — compose
          # needs KUBELET_VOLUMES_PATH set to interpolate volume mounts, and an
          # empty value here causes "invalid spec: ::rw: empty section between
          # colons", silently swallowing the actual container output.
          for c in rusternetes-etcd rusternetes-api-server rusternetes-scheduler \
                   rusternetes-controller-manager rusternetes-kubelet \
                   rusternetes-kubelet2 rusternetes-kube-proxy; do
            echo "===== $c =====" >> ../cluster-logs.txt
            sudo podman logs "$c" >> ../cluster-logs.txt 2>&1 || true
            echo "" >> ../cluster-logs.txt
          done
          sudo podman ps -a >> ../cluster-logs.txt 2>&1 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rusternetes-smoke-results
          path: |
            results.tar.gz
            sonobuoy-logs.txt
          retention-days: 7

      - name: Upload cluster logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rusternetes-cluster-logs
          path: cluster-logs.txt
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: rusternetes
        run: |
          sudo podman compose -f compose.yml down -v 2>/dev/null || true
          sudo podman network rm rusternetes-network 2>/dev/null || true
